<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="60%" stop-color="#0f2247"/>
      <stop offset="100%" stop-color="#1a3a6b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#93c5fd"/>
    </linearGradient>
    <!-- Subtle grid pattern -->
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#1e3a5f" stroke-width="0.5" opacity="0.5"/>
    </pattern>
  </defs>
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Grid overlay -->
  <rect width="1200" height="630" fill="url(#grid)"/>
  <!-- Glow effect -->
  <circle cx="200" cy="315" r="280" fill="#3b82f6" opacity="0.06"/>
  <circle cx="600" cy="200" r="180" fill="#60a5fa" opacity="0.04"/>

  <!-- Logo icon -->
  <rect x="80" y="80" width="80" height="80" rx="20" fill="#1a3a6b"/>
  <path d="M98 97 L98 143 L116 143 C128 143 138 136 138 120 C138 104 128 97 116 97 Z M108 107 L116 107 C122 107 128 112 128 120 C128 128 122 133 116 133 L108 133 Z" fill="#60a5fa"/>
  <circle cx="146" cy="137" r="6" fill="#3b82f6"/>

  <!-- Brand name -->
  <text x="180" y="133" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="700" fill="white" letter-spacing="-1">DeepSeek</text>
  <text x="180" y="133" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="700" fill="url(#accent)" letter-spacing="-1" x="484" y="133">FR</text>
  <!-- Override above with proper positioning -->
  <text x="180" y="133" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="700" fill="white" letter-spacing="-1">DeepSeek <tspan fill="#60a5fa">FR</tspan></text>

  <!-- Main headline -->
  <text x="80" y="290" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="800" fill="white" letter-spacing="-2">L&#x2019;IA DeepSeek</text>
  <text x="80" y="368" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="800" fill="#60a5fa" letter-spacing="-2">en fran&#xe7;ais</text>

  <!-- Subtitle -->
  <text x="80" y="440" font-family="system-ui, -apple-system, sans-serif" font-size="28" fill="#93c5fd" opacity="0.85">Chat IA gratuit &#xb7; DeepSeek V3 &#xb7; Sans inscription</text>

  <!-- Domain -->
  <text x="80" y="560" font-family="system-ui, -apple-system, sans-serif" font-size="22" fill="#60a5fa" opacity="0.7" letter-spacing="1">deepseekfr.org</text>

  <!-- Right side decorative element -->
  <g opacity="0.15">
    <circle cx="1050" cy="315" r="200" stroke="#60a5fa" stroke-width="1" fill="none"/>
    <circle cx="1050" cy="315" r="140" stroke="#60a5fa" stroke-width="1" fill="none"/>
    <circle cx="1050" cy="315" r="80" stroke="#60a5fa" stroke-width="1" fill="none"/>
    <circle cx="1050" cy="315" r="20" fill="#3b82f6"/>
  </g>
  <!-- Connection lines -->
  <line x1="1050" y1="115" x2="1050" y2="145" stroke="#60a5fa" stroke-width="1" opacity="0.2"/>
  <line x1="1050" y1="485" x2="1050" y2="515" stroke="#60a5fa" stroke-width="1" opacity="0.2"/>
  <line x1="850" y1="315" x2="880" y2="315" stroke="#60a5fa" stroke-width="1" opacity="0.2"/>
</svg>
